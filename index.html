<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Owluxe"><meta name="application-name" content="Owluxe"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="Owluxe: daily discipline challenges, workouts, streaks, ranks and progress tracking."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Owluxe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,500;0,700;0,800;1,800&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: single-column phone app — daily quote, rank card, task list, 5-tab bar. Owluxe brand book: black + bone, steel blue accent. Committed dark look. */
:root{
  --bg:#000000; --surface:#0d0e0e; --surface-2:#1a1c1c; --line:#2a2c2b;
  --fg:#f4f2e6; --muted:#8f8a7c; --gold:#4e8197; --gold-2:#cedfd9; --on-gold:#f4f2e6;
  --stone:#787262; --phys:#4e8197; --mind:#cedfd9; --soc:#787262; --disc:#f4f2e6; --warn:#d9a35f;
  --display:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif; --body:"Jost","Futura","Century Gothic",sans-serif; --mono:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.045em;text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}
h2{font-size:24px}
.view{display:flex;flex-direction:column;gap:18px}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.num{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.idx{font-weight:400;font-size:13px;color:var(--muted);letter-spacing:.04em}
.muted{color:var(--muted)} .small{font-size:13px}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.prestige{font-family:var(--display);font-style:italic;font-weight:800;letter-spacing:-.01em}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.date{color:var(--muted);font-size:13px;text-align:right}

.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sec-head>div{display:flex;flex-direction:column;gap:6px}

.quote{padding:22px 20px;border-left:3px solid var(--gold);background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 14%,transparent),transparent 80%);display:flex;flex-direction:column;gap:10px}
.quote p{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.2;letter-spacing:-.03em;text-wrap:balance}

.crest{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;position:relative;overflow:hidden}
.crest::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 26%,transparent),transparent 70%);pointer-events:none}
.ring{width:88px;height:88px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lv b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1;color:var(--gold-2)}
.ring .lv small{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted)}
.crest-info{min-width:0;display:flex;flex-direction:column;gap:6px}
.rank{font-family:var(--display);font-weight:800;letter-spacing:-.04em;text-transform:uppercase;font-size:22px;color:var(--gold-2);line-height:1}
.xpline{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:500}
.chip.hot{background:color-mix(in srgb,var(--gold) 28%,var(--surface-2));color:var(--gold-2)}

.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:99px;transition:width .4s ease}

.list{display:flex;flex-direction:column;gap:10px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;transition:transform .15s ease,border-color .2s}
.task:hover{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.task:active{transform:scale(.985)}
.check{width:26px;height:26px;border-radius:2px;border:2px solid var(--line);display:grid;place-items:center;transition:.2s}
.check svg{width:14px;height:14px;opacity:0}
.task.done .check{background:var(--gold);border-color:var(--gold)}
.task.done .check svg{opacity:1}
.task.done .t-title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.t-body{min-width:0}
.t-title{font-weight:500;display:block}
.t-meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:2px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.xp{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--gold-2);white-space:nowrap}
.tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-2);border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);padding:1px 6px;border-radius:99px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.week span{width:100%;max-width:38px;aspect-ratio:1;border-radius:3px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;color:var(--fg)}
.week span.full{background:var(--gold);color:var(--on-gold)}
.week span.part{background:color-mix(in srgb,var(--gold) 30%,var(--surface-2))}
.week span.frz{background:transparent;border:1px dashed var(--gold-2);color:var(--gold-2)}
.week .today span{outline:1px solid var(--gold-2);outline-offset:2px}
.cat{display:grid;grid-template-columns:100px 1fr auto;gap:12px;align-items:center;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--gold));border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--mono);font-size:20px;font-weight:800}

.tiers{display:flex;flex-direction:column;gap:6px}
.tier{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:8px 10px;border-radius:4px;color:var(--muted)}
.tier.on{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold-2)}
.tier b{font-family:var(--display);text-transform:uppercase;letter-spacing:-.02em}

textarea,input[type=text],input[type=number],select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:11px 12px;color:var(--fg)}
textarea{min-height:110px;resize:vertical}
.prompt{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:19px;line-height:1.25}
.btn{background:var(--gold);color:var(--on-gold);border:0;border-radius:2px;padding:12px 18px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:13px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.entry{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.entry p{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:4px;padding:3px;gap:3px}
.seg button{background:none;border:0;padding:8px;border-radius:3px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:14px}
.pill[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}

.event{display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:center}
.cal{background:var(--surface-2);border-radius:4px;text-align:center;padding:6px 0}
.cal b{display:block;font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.cal span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.lb-row{display:grid;grid-template-columns:28px 32px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lb-row:first-child{border-top:0}
.lb-row.me{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:4px;padding-inline:6px;margin-inline:-6px}
.lb-row img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
.lb-pos{font-family:var(--mono);font-weight:800;color:var(--muted);font-size:14px}
.lb-name{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.reward{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:4px}
.reward.locked{opacity:.5}
.code{font-family:var(--mono);font-weight:700;letter-spacing:.06em;background:var(--surface-2);padding:4px 8px;border-radius:2px;user-select:all}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;border-radius:3px;overflow:hidden;background:var(--surface-2);border:0;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#f4f2e6;text-align:left}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare figure{margin:0;display:flex;flex-direction:column;gap:6px}
.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:3px;background:var(--surface-2)}
.delta{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.04em;line-height:1}
.chart svg{width:100%;height:auto;display:block}
.recap img{width:100%;max-width:340px;margin:0 auto;border-radius:6px;border:1px solid var(--line);display:block;background:var(--surface-2);aspect-ratio:9/16}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--stone);padding-left:10px}

.tabs{isolation:isolate;position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tabs button{position:relative;background:none;border:0;padding:9px 1px 7px;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--display);font-weight:800;font-size:9.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.09em}
.tabs button::before{content:"";position:absolute;top:-7px;left:50%;width:0;height:2px;background:var(--gold);transform:translateX(-50%);transition:width .25s ease}
.tabs button[aria-selected="true"]::before{width:28px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--fg)}
.tabs button[aria-selected="true"] svg{color:var(--gold-2)}
.tabs::after{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--gold);color:var(--on-gold);padding:10px 16px;border-radius:2px;font-weight:500;opacity:0;transition:.3s;pointer-events:none;z-index:6;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.wo-clock{font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.setrow{display:grid;grid-template-columns:22px 1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.setrow.done .si{color:var(--muted)}
input.si{padding:8px 6px;text-align:center}
.setchk{width:38px;height:38px;border-radius:2px;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0}
.setchk svg{opacity:.25}
.setchk[aria-pressed="true"]{background:var(--gold);border-color:var(--gold)}
.setchk[aria-pressed="true"] svg{opacity:1}
.iconbtn{width:38px;height:38px;border-radius:2px;border:1px solid var(--line);background:none;display:grid;place-items:center;padding:0;color:var(--gold-2)}
.exitem{display:grid;grid-template-columns:1fr auto 34px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.ex-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-m{font-size:12px;color:var(--muted);white-space:nowrap}
.exitem .iconbtn{width:34px;height:34px;font-size:20px;line-height:1}
.exitem:first-child{border-top:0}
.rest{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--gold);color:var(--on-gold);padding:10px 14px;border-radius:4px;display:flex;align-items:center;gap:12px}
.rest b{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.rest .bar{flex:1;background:rgba(0,0,0,.25)}
.rest .bar i{background:var(--on-gold)}
.rest button{background:none;border:1px solid currentColor;color:inherit;border-radius:2px;padding:4px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.pills.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pills.scroll .pill{white-space:nowrap}
.pacer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.95);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.pacer-in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px;text-align:center}
.pacer-num{font-family:var(--display);font-weight:800;font-size:150px;line-height:1;letter-spacing:-.05em;color:var(--gold-2);font-variant-numeric:tabular-nums}
.pacer select,.pacer input{width:auto;display:inline-block;margin-left:6px}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cal-head b{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.08em}
.cday{position:relative;aspect-ratio:1;border:0;border-radius:3px;background:var(--surface-2);color:var(--fg);font-family:var(--mono);font-weight:700;font-size:13px;padding:0;display:grid;place-items:center}
.cday.full{background:var(--gold);color:var(--on-gold)}
.cday.part{background:color-mix(in srgb,var(--gold) 30%,var(--surface-2))}
.cday.frz{background:transparent;border:1px dashed var(--gold-2);color:var(--gold-2)}
.cday.out{visibility:hidden}
.cday:disabled{opacity:.3;cursor:default}
.cday.today{outline:1px solid var(--gold-2);outline-offset:1px}
.cday.sel{outline:2px solid var(--fg);outline-offset:2px}
.cday .wdot{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold-2)}
.cday.full .wdot{background:var(--on-gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.detail-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.detail-item:first-child{border-top:0}
.kcal{font-family:var(--display);font-weight:800;font-size:56px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.macros div{background:var(--surface-2);border-radius:4px;padding:8px 10px}
.macros b{display:block;font-family:var(--mono);font-weight:800;font-size:18px}
.fitem{display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.fitem:first-child{border-top:0}
.food-prev{width:100%;max-height:260px;object-fit:cover;border-radius:4px;background:var(--surface-2)}
.ref-code{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.08em;color:var(--gold-2)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold-2);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.sugg{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:9px 12px;margin-top:6px}
.sugg span{font-size:12px;color:var(--muted)}
.sugg:hover{border-color:var(--gold)}
body.light{--bg:#f4f2e6;--surface:#fbfaf4;--surface-2:#e8e4d6;--line:#d5cfbd;--fg:#0b0b0b;--muted:#6b665a;--gold:#3f6f84;--gold-2:#2f5d70;--on-gold:#f4f2e6;--stone:#787262;--phys:#4e8197;--mind:#6f9a90;--soc:#787262;--disc:#1a1c1c;--warn:#a2621a;color-scheme:light}
body.light .pacer{background:color-mix(in srgb,var(--bg) 97%,transparent)}
.pro-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.offline{display:inline-block;margin-top:4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--warn);color:var(--warn);padding:1px 6px;border-radius:99px}
.hdr-r{display:flex;align-items:center;gap:12px;min-width:0}
.hdr-ctl{display:flex;align-items:center;gap:6px}
.lang-tg{display:flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--surface)}
.lang-tg button{border:0;background:none;border-radius:99px;padding:5px 9px;font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.lang-tg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}

function tr(s){if(LANG!=="es"||!s)return s;const k=s.trim();if(!k)return s;if(ES[k]!=null)return s.replace(k,ES[k]);for(const [r,f] of ES_RX){if(r.test(k))return s.replace(k,k.replace(r,f));}return s;}
function trTree(root){if(LANG!=="es"||!root)return;if(root.nodeType===3){const v=root.nodeValue,n=tr(v);if(n!==v)root.nodeValue=n;return;}if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];let n;while((n=w.nextNode()))list.push(n);
  for(const x of list){const pe=x.parentElement;if(pe&&pe.closest("script,style,textarea,[data-notr]"))continue;const v=x.nodeValue,nv=tr(v);if(nv!==v)x.nodeValue=nv;}
  const els=root.querySelectorAll?[root,...root.querySelectorAll("[placeholder],[aria-label],[title]")]:[];
  for(const el of els){if(!el.getAttribute)continue;for(const a of ["placeholder","aria-label","title"]){const v=el.getAttribute(a);if(v){const nv=tr(v);if(nv!==v)el.setAttribute(a,nv);}}}}
new MutationObserver(ms=>{if(LANG!=="es")return;for(const m of ms){if(m.type==="characterData")trTree(m.target);else m.addedNodes.forEach(trTree);}}).observe(document.body,{childList:true,subtree:true,characterData:true});

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const TODAY=iso(new Date());
const D=s=>new Date(s+"T12:00");
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d);};
const weekStart=s=>{const d=D(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);};

function rng(seed){let h=2166136261;for(const ch of seed)h=Math.imul(h^ch.charCodeAt(0),16777619);return()=>{h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296;};}
const quoteFor=date=>QUOTES[Math.floor(rng("q"+date)()*QUOTES.length)];
function dailyFor(date){
  const r=rng(date),out=[],base=CHALLENGES.map((c,i)=>({...c,key:"c"+i}));
  for(const k of Object.keys(CATS)){const pool=base.filter(c=>c.cat===k);if(pool.length)out.push(pool[Math.floor(r()*pool.length)]);}
  const f=FOCUSES[S.focus];
  if(f&&f.pool.length){const j=Math.floor(r()*f.pool.length);const b=f.pool[j];out.push({...b,xp:b.xp*2,bonus:f.n,key:`f:${S.focus}:${j}`});}
  else{const rest=base.filter(c=>!out.some(o=>o.key===c.key));if(rest.length){const b=rest[Math.floor(r()*rest.length)];out.push({...b,xp:b.xp*2,bonus:"Bonus",key:b.key});}}
  S.custom.forEach(c=>out.push({cat:c.cat,t:c.t,xp:CUSTOM_XP,custom:true,key:"u:"+c.id}));
  progTasks(date).forEach(x=>out.push(x));
  EVENTS.filter(e=>e.date===date).forEach(e=>out.push({cat:"social",t:"Attend: "+e.t,xp:e.xp,event:true,key:"e:"+e.id}));

}

const dayMap=d=>S.days[d]||{};
const isBonusKey=k=>/^(pd|chest|q:|sm:|a:|pb:)/.test(k);
const dayCount=d=>Object.keys(dayMap(d)).filter(k=>!isBonusKey(k)).length;
const dayOk=d=>dayCount(d)>=DAILY_GOAL||!!S.frozen[d];
const sumDay=d=>Object.values(dayMap(d)).reduce((a,v)=>a+v[0],0);
const totalXP=()=>Object.keys(S.days).reduce((a,d)=>a+sumDay(d),0)+refXP()+(S.adminXP||0);
const weekXP=(wk=weekStart(TODAY))=>Object.keys(S.days).filter(d=>weekStart(d)===wk).reduce((a,d)=>a+sumDay(d),0);
const weekDone=(wk=weekStart(TODAY))=>Object.keys(S.days).filter(d=>weekStart(d)===wk).reduce((a,d)=>a+dayCount(d),0);
const levelOf=xp=>Math.floor(Math.sqrt(xp/40))+1;
const xpFor=l=>40*(l-1)*(l-1);
const tierIdx=l=>TIERS.reduce((a,t,i)=>l>=t[1]?i:a,0);
function streak(){let d=dayOk(TODAY)?TODAY:addDays(TODAY,-1),n=0,g=0;while(dayOk(d)&&g++<3000){if(dayCount(d)>=DAILY_GOAL)n++;d=addDays(d,-1);}return n;}
function best(){const ds=Object.keys(S.days).concat(Object.keys(S.frozen)).sort();if(!ds.length)return 0;let d=ds[0],b=0,c=0,g=0;while(d<=TODAY&&g++<5000){if(dayOk(d)){if(dayCount(d)>=DAILY_GOAL)c++;}else c=0;b=Math.max(b,c);d=addDays(d,1);}return b;}
const freezesUsed=wk=>Object.keys(S.frozen).filter(d=>S.frozen[d]&&weekStart(d)===wk).length;
const freezesLeft=()=>Math.max(0,FREEZES_PER_WEEK-freezesUsed(weekStart(TODAY)));
function autoFreeze(){const y=addDays(TODAY,-1),yy=addDays(TODAY,-2);if(!dayOk(y)&&dayOk(yy)&&freezesUsed(weekStart(y))<FREEZES_PER_WEEK){S.frozen[y]=true;return true;}return false;}
function catXP(){const o={physical:0,mind:0,social:0,discipline:0};for(const m of Object.values(S.days))for(const v of Object.values(m))if(o[v[1]]!=null)o[v[1]]+=v[0];return o;}
function weekCatXP(wk){const o={physical:0,mind:0,social:0,discipline:0};for(const [d,m] of Object.entries(S.days))if(weekStart(d)===wk)for(const v of Object.values(m))if(o[v[1]]!=null)o[v[1]]+=v[0];return o;}

function weightChart(ps){
  const pts=ps.filter(p=>typeof p.w==="number"&&p.w>0);
  if(pts.length<2)return `<p class="empty">Add a weight to two or more check-ins to see your trend.</p>`;
  const conv=w=>S.unit==="kg"?w:w*2.20462;  // stored in kg

  let lo=Math.min(...ys),hi=Math.max(...ys);const pad=Math.max(1,(hi-lo)*.15);lo=Math.floor(lo-pad);hi=Math.ceil(hi+pad);
  const W=320,H=150,L=36,R=10,T=10,B=24,x0=xs[0],x1=Math.max(xs[xs.length-1],x0+1);
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const line=pts.map((p,i)=>`${i?"L":"M"}${X(xs[i]).toFixed(1)} ${Y(ys[i]).toFixed(1)}`).join(" ");
  const area=line+` L${X(xs[xs.length-1]).toFixed(1)} ${H-B} L${X(xs[0]).toFixed(1)} ${H-B}Z`;
  const ticks=[lo,(lo+hi)/2,hi];
  const dl=d=>new Date(d).toLocaleDateString(L(),{month:"short",day:"numeric"});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time">
    <defs><linearGradient id="wa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".35"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(t)+4}" fill="var(--muted)" font-size="10" text-anchor="end" font-family="Jost,sans-serif">${Math.round(t)}</text>`).join("")}
    <path d="${area}" fill="url(#wa)"/><path d="${line}" fill="none" stroke="var(--gold-2)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(ys[i])}" r="${i===pts.length-1?4:2.5}" fill="${i===pts.length-1?"var(--gold-2)":"var(--gold)"}"/>`).join("")}
    <text x="${L}" y="${H-6}" fill="var(--muted)" font-size="10" font-family="Jost,sans-serif">${dl(xs[0])}</text>
    <text x="${W-R}" y="${H-6}" fill="var(--muted)" font-size="10" text-anchor="end" font-family="Jost,sans-serif">${dl(xs[xs.length-1])}</text></svg></div>`;
}

  pacer={ei,si,mode:timed?"set":(S.pacerMode||"rep"),sec:S.paceSec||3,target:st.r||10,len:x.k==="time"&&st.s?st.s:(S.setSec||45),count:0,running:false,t0:0,cd:0,beeped:0};
  renderPacer();

function renderPacer(){
  let o=$("#pacer");if(!pacer||!S.active){pacer=null;if(o)o.remove();return;}
  if(!o){o=document.createElement("div");o.id="pacer";o.className="pacer";o.setAttribute("role","dialog");o.setAttribute("aria-label","Set timer");document.body.appendChild(o);}
  const x=S.active.ex[pacer.ei],hasReps=x.k==="weighted"||x.k==="reps",P=pacer;

    :`<div class="row" style="justify-content:center;gap:16px"><label class="small muted">Seconds per rep<select id="pc-sec">${[1,2,3,4,5,6,8,10].map(n=>`<option ${n===P.sec?"selected":""}>${n}</option>`).join("")}</select></label>
      <label class="small muted">Reps<input id="pc-target" type="number" inputmode="numeric" min="1" max="100" value="${P.target}" style="width:70px"></label></div>`;

    ${P.running?"":modeSeg}

    <p class="muted" id="pc-sub">${P.running?"Get ready":P.mode==="set"?"Counts down, then marks the set done":"reps, one beep per rep"}</p>
    <div class="bar" style="height:10px"><i id="pc-bar" style="width:${P.mode==="set"?100:0}%"></i></div>
    ${P.running?"":setup}

}
function startRest(){if(S.active&&S.active.rest>0){restLen=S.active.rest;restEnd=Date.now()+restLen*1000;}}
function pacerSave(){
  const P=pacer,x=S.active&&S.active.ex[P.ei],st=x&&x.sets[P.si];
  if(P.mode==="set"){
    const secs=Math.max(0,Math.round(Math.min(P.len,(Date.now()-P.t0)/1000-3)));
    if(st&&secs>0){if(x.k==="time")st.s=secs;if(x.k==="cardio")st.m=Math.max(1,Math.round(secs/60));if(!st.done){st.done=true;startRest();}}
    pacer=null;renderPacer();save();render();if(secs>0)toast(`Set done · ${clock(secs)}`);return;
  }
  const n=P.count;
  if(st&&n>0){st.r=n;if(!st.done){st.done=true;startRest();}}
  pacer=null;renderPacer();save();render();if(n>0)toast(`${n} reps logged`);

setInterval(()=>{
  if(pacer&&pacer.running){const P=pacer,el=(Date.now()-P.t0)/1000-3,num=$("#pc-num"),sub=$("#pc-sub"),bar=$("#pc-bar");
    if(el<0){const c=Math.ceil(-el);if(c!==P.cd){P.cd=c;beep(440,90);}if(num)num.textContent=c;if(sub)sub.textContent="Get ready";}
    else if(P.mode==="set"){const left=P.len-el,sec=Math.ceil(left);
      if(left<=0){beep(1320,400);pacerSave();return;}
      if(sec<=3&&sec!==P.beeped){P.beeped=sec;beep(880,120);}
      if(num)num.textContent=clock(sec);if(sub)sub.textContent=sec<=3?"Almost there":"Keep going";if(bar)bar.style.width=(left/P.len*100)+"%";}
    else{const reps=Math.floor(el/P.sec);if(reps>P.count){P.count=reps;beep(reps>=P.target?1320:880,140);}
      if(num)num.textContent=P.count;if(sub)sub.textContent=`Rep ${Math.min(P.count+1,P.target)} of ${P.target}`;if(bar)bar.style.width=((el%P.sec)/P.sec*100)+"%";
      if(P.count>=P.target){pacerSave();return;}}}
  const a=S.active;if(!a||tab!=="train")return;
  const c=$("#wt-clock");if(c)c.textContent=clock((Date.now()-a.start)/1000);
  const sets=doneSets(a),xe=$("#wt-xp");if(xe)xe.textContent="+"+workoutXP((Date.now()-a.start)/60000,sets);const se=$("#wt-sets");if(se)se.textContent=sets;
  const rb=$("#rest");if(rb){const left=(restEnd-Date.now())/1000;
    if(restEnd&&left>0){rb.hidden=false;rb.querySelector("b").textContent=clock(Math.ceil(left));rb.querySelector("i").style.width=(left/restLen*100)+"%";}
    else{if(restEnd){restEnd=0;beep(660,300);setTimeout(()=>beep(990,300),320);toast("Rest's over. Next set");}rb.hidden=true;}}
},200);

function itemName(k,date){

  if(k.startsWith("f:")){const [,f,j]=k.split(":");const c=FOCUSES[f]&&FOCUSES[f].pool[+j];return c?c.t+" (2× bonus)":"Focus bonus";}
  if(k.startsWith("u:")){const c=S.custom.find(x=>x.id===k.slice(2));return c?c.t:"Personal habit";}
  if(k.startsWith("e:")){const ev=EVENTS.find(x=>x.id===k.slice(2));return ev?"Attended: "+ev.t:"Owluxe event";}
  if(k.startsWith("p:")){const [,pid,di,j]=k.split(":");const pr=PROGRAMS.find(x=>x.id===pid);const tk=pr&&pr.day(+di)[+j];return tk?(LANG==="es"?tk[1]:tk[0]):"Program task";}

function lineChart(pts,unit){if(pts.length<2)return `<p class="empty">Log an exercise in two or more workouts to see a trend.</p>`;
  const ys=pts.map(p=>p.y),xs=pts.map(p=>p.x);let lo=Math.min(...ys),hi=Math.max(...ys);const pad=Math.max(1,(hi-lo)*.15);lo=Math.max(0,Math.floor(lo-pad));hi=Math.ceil(hi+pad);
  const W=320,H=150,Lm=36,R=10,T=10,B=24,x0=xs[0],x1=Math.max(xs[xs.length-1],x0+1),X=v=>Lm+(v-x0)/(x1-x0)*(W-Lm-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const line=pts.map((p,i)=>`${i?"L":"M"}${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(" "),area=line+` L${X(xs[xs.length-1]).toFixed(1)} ${H-B} L${X(xs[0]).toFixed(1)} ${H-B}Z`;
  const dl=d=>new Date(d).toLocaleDateString(L(),{month:"short",day:"numeric"});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress over time"><defs><linearGradient id="pa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".35"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>
    ${[lo,(lo+hi)/2,hi].map(t=>`<line x1="${Lm}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${Lm-6}" y="${Y(t)+4}" fill="var(--muted)" font-size="10" text-anchor="end" font-family="Jost,sans-serif">${Math.round(t)}</text>`).join("")}
    <path d="${area}" fill="url(#pa)"/><path d="${line}" fill="none" stroke="var(--gold-2)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${i===pts.length-1?4:2.5}" fill="${i===pts.length-1?"var(--gold-2)":"var(--gold)"}"/>`).join("")}
    <text x="${Lm}" y="${H-6}" fill="var(--muted)" font-size="10" font-family="Jost,sans-serif">${dl(xs[0])}</text><text x="${W-R}" y="${H-6}" fill="var(--muted)" font-size="10" text-anchor="end" font-family="Jost,sans-serif">${dl(xs[xs.length-1])}</text></svg></div>
    <p class="small muted">Best set per workout${unit?` (${unit})`:""}</p>`;}
function exProgressSection(){
  const names=[...new Set((S.workouts||[]).flatMap(w=>w.ex.map(x=>x.n)))].sort();
  let body;
  if(!isPro())body=`<p class="small muted">See your best set for every exercise over time.</p><button class="btn ghost sm" data-tab="rank" style="align-self:flex-start">Unlock with Pro</button>`;

    for(const w of (S.workouts||[]).slice().sort((a,b)=>a.d-b.d)){const x=w.ex.find(e=>e.n===n);if(!x)continue;k=x.k;let v=0;

    body=`<select id="prog-ex" aria-label="Exercise">${names.map(x=>`<option ${x===n?"selected":""}>${esc(x)}</option>`).join("")}</select>${lineChart(pts,unit)}`;}

function burst(cv,ti,big,delay=0){

    addFood({id:"f"+Date.now().toString(36),t:Date.now(),name:it.map(x=>x.name).join(", ").slice(0,120),...tot,ai:true});foodRes=null;foodImg="";foodBlob=null;toast(`Logged ${tot.cal} kcal`);render();return;}
  if(id==="fm-add"){const n=($("#fm-name").value||"").trim(),cal=Math.round(+$("#fm-cal").value||0);if(!n||!cal){toast("Add a food name and calories");return;}
    addFood({id:"f"+Date.now().toString(36),t:Date.now(),name:n.slice(0,60),cal,p:Math.round(+$("#fm-p").value||0),c:Math.round(+$("#fm-c").value||0),f:Math.round(+$("#fm-f").value||0)});["fm-name","fm-cal","fm-p","fm-c","fm-f"].forEach(k=>$("#"+k).value="");$("#fm-qty").value="1";fmBase=null;fmSugg=[];fmErr="";toast(`Logged ${cal} kcal`);render();return;}
  if(id==="cal-save"){S.calTarget=Math.max(0,Math.round(+$("#cal-target").value||0));save();toast(S.calTarget?"Target saved":"Target cleared");render();return;}
  if(id==="ex-more"){exShow+=20;const r=$("#ex-results");if(r)r.innerHTML=exResults();return;}
  if(id==="wo-start"){startWorkout(null);return;}
  if(id==="wo-pick"){exPick=true;render();const q=$("#ex-q");if(q){q.focus();q.scrollIntoView({block:"center"});}return;}
  if(id==="wo-finish"){finishWorkout();return;}
  if(id==="wo-discard"){if(discardArmed){S.active=null;restEnd=0;discardArmed=false;exPick=false;save();releaseWake();render();toast("Workout discarded");}else{discardArmed=true;render();}return;}
  if(id==="rest-skip"){restEnd=0;const rb=$("#rest");if(rb)rb.hidden=true;return;}
  if(id==="sum-close"){lastSummary=null;render();return;}
  if(id==="cust-add"){const v=$("#cust-t").value.trim();if(!v){toast("Type a habit first");return;}S.custom.push({id:Date.now().toString(36),t:v.slice(0,60),cat:$("#cust-c").value});$("#cust-t").value="";save();toast("Habit added to your daily list");render();return;}
  if(id==="jsave"){const v=$("#jtext").value.trim();if(!v){toast("Write something first");return;}S.journal.push({d:Date.now(),p:PROMPTS[new Date().getDay()%PROMPTS.length],t:v});$("#jtext").value="";save();render();toast("Entry saved");return;}
  if(id==="pick-photo"){$("#photo-file").click();return;}
  if(id==="save-checkin"){saveCheckin();return;}
  if(id==="recap-save"){if(!dl||!recapBlob)return;try{await dl.save({filename:`owluxe-week-${weekStart(TODAY)}.png`,data:recapBlob});toast("Recap saved");}catch(err){if(err&&err.code!=="declined")toast("Couldn't save the image. Long-press it instead.");}return;}
  if(id==="reset"){if(resetArmed){const keepFocus=S.focus,keepCrew=S.crew,keepUnit=S.unit;S=blank();S.focus=keepFocus;S.crew=keepCrew;S.unit=keepUnit;resetArmed=false;save();render();toast("Progress reset");}else{resetArmed=true;render();}}
});
document.addEventListener("change",async e=>{
  if(e.target.id==="crew-sel"){S.crew=e.target.value;save();toast(S.crew?`Joined ${S.crew}`:"Left your crew");render();}
  if(e.target.id==="backup-file"){const f=e.target.files&&e.target.files[0];e.target.value="";if(f)importBackup(f);return;}
  if(e.target.id==="prog-ex"){progExName=e.target.value;render();return;}
  if(e.target.id==="food-file"){const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;try{foodImg=await fileToJpeg(f);foodBlob=dataURLtoBlob(foodImg);foodRes=null;foodErr="";}catch(_){foodErr="That file couldn't be read as an image.";}render();return;}
  if(e.target.id==="photo-file"){const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;try{pendingPhoto=await fileToJpeg(f);photoMsg="";}catch(_){photoMsg="That file couldn't be read as an image.";}render();}
});

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains("si")&&S.active){const x=S.active.ex[+t.dataset.ei],st=x&&x.sets[+t.dataset.si];if(!st)return;const v=t.value===""?null:parseFloat(t.value),f=t.dataset.f;
    st[f]=v==null||isNaN(v)?null:f==="w"?fromU(v):f==="dist"?fromD(v):v;save();}
  if(t.id==="pl-q"){plQ=t.value;plShow=6;const r=$("#pl-results");if(r)r.innerHTML=plResults();}
  if(t.id==="ex-q"){exQ=t.value;exShow=8;const r=$("#ex-results");if(r)r.innerHTML=exResults();}
  if(t.id==="pc-len"&&pacer){const v=+t.value;if(v>=5){pacer.len=Math.round(v);document.querySelectorAll("[data-plen]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.plen===pacer.len)));const n=$("#pc-num");if(n)n.textContent=clock(pacer.len);}}
  if(t.classList&&t.classList.contains("fi")&&foodRes){const it=foodRes.items[+t.dataset.i];if(it){if(t.dataset.f==="cal")it.cal=Math.max(0,Math.round(+t.value||0));else it.name=t.value.slice(0,60);}}
  if(t.id==="fm-name"){fmBase=null;const sv=$("#fm-serv");if(sv)sv.hidden=true;fmSugg=foodSuggest(t.value);drawSugg();}
  if(t.id==="fm-qty"&&fmBase)fillFromBase();
  if(["fm-cal","fm-p","fm-c","fm-f"].includes(t.id)&&fmBase){fmBase=null;const sv=$("#fm-serv");if(sv)sv.hidden=true;}
  if(t.id==="wo-name"&&S.active){S.active.name=t.value.slice(0,40);save();}
});
document.addEventListener("change",e=>{if(e.target.id==="rest-len"&&S.active){S.active.rest=+e.target.value;save();}});
if(S.active)requestWake();
if(S.program){const p=curProg();if(!p||progDay()>p.days)S.program=null;}
applyTheme();
addEventListener("online",render);addEventListener("offline",render);
if(STANDALONE&&"serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{const am=location.hash.match(/^#admin-([A-Za-z0-9]{6,32})$/);if(am&&await adminUnlock(am[1])){tab="rank";render();toast("Admin mode on");}})();
(async()=>{const m=location.hash.match(/^#pro-([A-Za-z0-9]{6,32})$/);if(m&&await tryUnlock(m[1])){tab="rank";render();toast("Pro unlocked. Welcome to Owluxe Pro");}})();
if(autoFreeze())setTimeout(()=>toast("Streak freeze used for yesterday"),600);
saveLocal();render();boot();
</script>
